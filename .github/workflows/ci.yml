---
name: Windows Server QE CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-ci:
    name: Offline QE Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible

      - name: Check Python syntax
        run: |
          python -m py_compile \
            scripts/qe_report.py \
            scripts/infrastructure_report.py

      - name: Check Bash syntax
        run: |
          bash -n scripts/run-qe-validation.sh
          bash -n scripts/run-srv01-validation.sh
          bash -n scripts/run-infrastructure-validation.sh
          bash -n scripts/run-infrastructure-negative-test.sh
          bash -n scripts/run-qe-negative-test.sh
          bash -n scripts/run-qe-missing-report-test.sh
          bash -n scripts/test-qe-harness.sh
          bash -n scripts/run-ci-checks.sh

      - name: Check DC01 Ansible playbook syntax
        run: |
          ansible-playbook \
            -i localhost, \
            playbooks/dc01-validation-suite.yml \
            --syntax-check

      - name: Check SRV01 Ansible playbook syntax
        run: |
          ansible-playbook \
            -i localhost, \
            playbooks/srv01-validation-suite.yml \
            --syntax-check

      - name: Check SRV01 negative playbook syntax
        run: |
          ansible-playbook \
            -i localhost, \
            playbooks/srv01-negative-validation-suite.yml \
            --syntax-check

      - name: Run QE harness self-tests
        run: |
          ./scripts/test-qe-harness.sh

      - name: CI summary
        run: |
          echo "Offline Windows Server QE checks passed."
