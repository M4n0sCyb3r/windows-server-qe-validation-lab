---
- name: Windows Process Validation
  hosts: windows
  gather_facts: false

  tasks:
    - name: Check DNS process
      ansible.windows.win_shell: |
        Get-Process -Name dns -ErrorAction SilentlyContinue
      register: dns_process
      changed_when: false

    - name: Validate DNS process is running
      ansible.builtin.assert:
        that:
          - dns_process.stdout | length > 0
        success_msg: "PASS: DNS process is running"
        fail_msg: "FAIL: DNS process is not running"
