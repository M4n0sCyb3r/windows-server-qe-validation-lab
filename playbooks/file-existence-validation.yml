---
- name: Windows File Existence Validation
  hosts: windows
  gather_facts: false

  vars_files:
    - ../vars/dc01-baseline.yml

  tasks:
    - name: Check required files exist
      ansible.windows.win_powershell:
        script: |
          Test-Path "{{ item }}"
      loop: "{{ required_files }}"
      register: file_results
      changed_when: false

    - name: Validate required files exist
      ansible.builtin.assert:
        that:
          - item.output[0] == true
        success_msg: "PASS: {{ item.item }} exists"
        fail_msg: "FAIL: {{ item.item }} does not exist"
      loop: "{{ file_results.results }}"
