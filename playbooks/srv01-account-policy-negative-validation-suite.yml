---
- name: SRV01 Controlled Account Policy Negative Validation
  hosts: srv01
  gather_facts: false

  vars:
    account_policy:
      minimum_password_age: 1
      maximum_password_age: 42
      minimum_password_length: 14
      password_complexity: 1
      password_history_size: 24
      lockout_bad_count: 0

  tasks:
    - name: Initialize QE results list
      ansible.builtin.set_fact:
        qe_results: []
      changed_when: false

    - name: Run controlled account policy negative validation
      ansible.builtin.import_tasks: tasks/validate-account-policy.yml
      ignore_errors: true

    - name: Display collected negative account policy results
      ansible.builtin.debug:
        var: qe_results
