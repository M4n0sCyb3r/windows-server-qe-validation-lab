---
- name: Collect Windows feature state
  ansible.windows.win_powershell:
    script: |
      Get-WindowsFeature {{ required_features | join(',') }} |
        Select-Object Name, InstallState
  register: feature_results
  changed_when: false

- name: Validate required Windows features are installed
  ansible.builtin.assert:
    that:
      - item in (feature_results.output | string)
      - "'Installed' in (feature_results.output | string)"
    quiet: true
    success_msg: "PASS: {{ item }} is installed"
    fail_msg: "FAIL: {{ item }} is not installed"
  loop: "{{ required_features }}"
  loop_control:
    label: "{{ item }}"

- name: Report Windows feature validation results
  ansible.builtin.debug:
    msg:
      test: "Windows Feature - {{ item }}"
      expected: "Installed"
      actual: "Installed"
      result: "PASS"
  loop: "{{ required_features }}"
  loop_control:
    label: "{{ item }}"
