---
- name: Collect Advanced Audit Policy
  ansible.windows.win_powershell:
    script: |
      $subcategories = @(
          "Logon",
          "Account Lockout",
          "User Account Management",
          "Security Group Management"
      )

      $results = @{}

      foreach ($subcategory in $subcategories) {
          $output = auditpol /get /subcategory:"$subcategory"

          if ($LASTEXITCODE -ne 0) {
              throw "auditpol failed for subcategory '$subcategory'"
          }

          $settingLine = $output |
              Where-Object {
                  $_ -match "^\s*$([regex]::Escape($subcategory))\s+"
              } |
              Select-Object -First 1

          if (-not $settingLine) {
              throw "Could not parse audit policy for '$subcategory'"
          }

          $setting = (
              $settingLine -replace "^\s*$([regex]::Escape($subcategory))\s+", ""
          ).Trim()

          $results[$subcategory] = $setting
      }

      $evidence = [PSCustomObject]@{
          logon = $results["Logon"]
          account_lockout = $results["Account Lockout"]
          user_account_management = $results["User Account Management"]
          security_group_management = $results["Security Group Management"]
      }

      $evidence | ConvertTo-Json -Compress
  register: audit_policy_raw
  changed_when: false

- name: Parse Advanced Audit Policy evidence
  ansible.builtin.set_fact:
    audit_policy_actual: "{{ audit_policy_raw.output[0] | from_json }}"
  changed_when: false

- name: Initialize Advanced Audit Policy result list
  ansible.builtin.set_fact:
    audit_policy_results: []
  changed_when: false

- name: Build individual Advanced Audit Policy results
  ansible.builtin.set_fact:
    audit_policy_results: >-
      {{
        audit_policy_results + [
          {
            'test': 'Audit Policy - ' ~ item.key,
            'expected': {
              'setting': item.value
            },
            'actual': {
              'setting': audit_policy_actual[item.key]
            },
            'result': (
              'PASS'
              if audit_policy_actual[item.key] == item.value
              else 'FAIL'
            )
          }
        ]
      }}
  loop: "{{ advanced_audit_policy | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: false

- name: Calculate failed Advanced Audit Policy checks
  ansible.builtin.set_fact:
    audit_policy_failures: >-
      {{
        audit_policy_results
        | selectattr('result', 'equalto', 'FAIL')
        | list
      }}
  changed_when: false

- name: Display Advanced Audit Policy evidence
  ansible.builtin.debug:
    msg:
      test: "Advanced Audit Policy"
      results: "{{ audit_policy_results }}"
      failures: "{{ audit_policy_failures }}"
      result: >-
        {{
          'PASS'
          if (audit_policy_failures | length) == 0
          else 'FAIL'
        }}

- name: Add Advanced Audit Policy results to QE results
  ansible.builtin.set_fact:
    qe_results: "{{ qe_results + audit_policy_results }}"
  changed_when: false

- name: Assert Advanced Audit Policy matches baseline
  ansible.builtin.assert:
    that:
      - (audit_policy_failures | length) == 0
    success_msg: "PASS: Advanced Audit Policy matches baseline."
    fail_msg: >-
      FAIL: One or more Advanced Audit Policy settings do not match baseline:
      {{ audit_policy_failures }}
    quiet: true
