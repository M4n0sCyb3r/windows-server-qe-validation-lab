---
- name: Check required files exist
  ansible.windows.win_powershell:
    script: |
      Test-Path "{{ item }}"
  loop: "{{ required_files }}"
  register: file_results
  changed_when: false

- name: Validate required files exist
  ansible.builtin.assert:
    that:
      - item.output[0] == true
    quiet: true
    success_msg: "PASS: {{ item.item }} exists"
    fail_msg: "FAIL: {{ item.item }} does not exist"
  loop: "{{ file_results.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Report required file validation results
  ansible.builtin.debug:
    msg:
      test: "Required File - {{ item.item }}"
      expected:
        exists: true
      actual:
        exists: "{{ item.output[0] }}"
      result: "{{ 'PASS' if item.output[0] == true else 'FAIL' }}"
  loop: "{{ file_results.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Collect required hosts file content
  ansible.windows.win_powershell:
    script: |
      Get-Content "{{ required_file_content.hosts.path }}"
  register: hosts_content
  changed_when: false

- name: Validate expected hosts file content
  ansible.builtin.assert:
    that:
      - required_file_content.hosts.expected_text in (hosts_content.output | string)
    quiet: true
    success_msg: "PASS: hosts file contains expected baseline content"
    fail_msg: "FAIL: hosts file is missing expected baseline content"

- name: Report hosts file content validation result
  ansible.builtin.debug:
    msg:
      test: "Hosts File Content"
      expected: "{{ required_file_content.hosts.expected_text }}"
      actual: "{{ hosts_content.output }}"
      result: "{{ 'PASS' if required_file_content.hosts.expected_text in (hosts_content.output | string) else 'FAIL' }}"
