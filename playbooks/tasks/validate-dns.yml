---
- name: Collect DNS client configuration
  ansible.windows.win_powershell:
    script: |
      $dns = Get-DnsClientServerAddress `
        -InterfaceAlias "Ethernet" `
        -AddressFamily IPv4

      $dns.ServerAddresses
  register: dns_client
  changed_when: false

- name: Validate DC01 DNS client configuration
  ansible.builtin.assert:
    that:
      - dns_client_server in dns_client.output
    quiet: true
    success_msg: "PASS: Ethernet DNS client includes {{ dns_client_server }}"
    fail_msg: "FAIL: Ethernet DNS client does not include expected DNS server {{ dns_client_server }}"

- name: Report DNS client validation result
  ansible.builtin.debug:
    msg:
      test: "DNS Client"
      expected: "{{ dns_client_server }}"
      actual: "{{ dns_client.output }}"
      result: "{{ 'PASS' if dns_client_server in dns_client.output else 'FAIL' }}"

- name: Add DNS client result to QE results
  ansible.builtin.set_fact:
    qe_results: >-
      {{
        qe_results
        + [
            {
              'test': 'DNS Client',
              'expected': dns_client_server,
              'actual': dns_client.output,
              'result': (
                'PASS'
                if dns_client_server in dns_client.output
                else 'FAIL'
              )
            }
          ]
      }}
  changed_when: false
