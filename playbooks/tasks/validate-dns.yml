---
- name: Collect DNS client configuration
  ansible.windows.win_powershell:
    script: |
      $dns = Get-DnsClientServerAddress `
        -InterfaceAlias "Ethernet" `
        -AddressFamily IPv4

      $dns.ServerAddresses
  register: dns_client
  changed_when: false

- name: Validate DC01 DNS client configuration
  ansible.builtin.assert:
    that:
      - dns_client_server in dns_client.output
    success_msg: "PASS: Ethernet DNS client includes {{ dns_client_server }}"
    fail_msg: "FAIL: Ethernet DNS client does not include expected DNS server {{ dns_client_server }}"
