---
- name: SRV01 Windows Server QE Validation Suite
  hosts: srv01
  gather_facts: false

  vars_files:
    - ../vars/srv01-baseline.yml

  tasks:
    - name: Initialize SRV01 QE state
      ansible.builtin.set_fact:
        qe_results: []
        qe_suite_failed: false
        qe_failed_task: ""
        qe_failure_message: ""
        qe_supported_scopes:
          - identity
          - time
          - network
          - defender
          - services
          - dns
          - features
          - firewall
          - eventlog
          - eventhealth
          - patchhealth
          - scheduledtask
          - accountpolicy
          - admingroup
          - accountstate
          - userrights
          - auditpolicy
          - securityoptions
        qe_completed_scopes: []
      changed_when: false
      tags:
        - always

    - name: Determine requested SRV01 validation scopes
      ansible.builtin.set_fact:
        qe_requested_scopes: >-
          {{
            (
              qe_supported_scopes
              if 'all' in ansible_run_tags
              else
              (
                qe_supported_scopes
                | select('in', ansible_run_tags)
                | list
              )
            )
            | reject('in', ansible_skip_tags)
            | list
          }}
      changed_when: false
      tags:
        - always

    - name: Run SRV01 validation workflow
      block:
        - name: Validate server identity and domain role
          ansible.builtin.import_tasks: tasks/validate-identity.yml
          tags:
            - identity

        - name: Record identity scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['identity'] }}"
          changed_when: false
          tags:
            - identity

        - name: Validate Windows Time synchronization
          ansible.builtin.import_tasks: tasks/validate-time.yml
          tags:
            - time

        - name: Record time scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['time'] }}"
          changed_when: false
          tags:
            - time

        - name: Validate network configuration
          ansible.builtin.import_tasks: tasks/validate-network.yml
          tags:
            - network

        - name: Record network scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['network'] }}"
          changed_when: false
          tags:
            - network

        - name: Validate Microsoft Defender health
          ansible.builtin.import_tasks: tasks/validate-defender.yml
          tags:
            - defender

        - name: Record defender scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['defender'] }}"
          changed_when: false
          tags:
            - defender

        - name: Validate required services
          ansible.builtin.import_tasks: tasks/validate-services.yml
          tags:
            - services

        - name: Record services scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['services'] }}"
          changed_when: false
          tags:
            - services

        - name: Validate DNS client configuration
          ansible.builtin.import_tasks: tasks/validate-dns.yml
          tags:
            - dns

        - name: Record DNS scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['dns'] }}"
          changed_when: false
          tags:
            - dns

        - name: Validate required Windows features
          ansible.builtin.import_tasks: tasks/validate-features.yml
          tags:
            - features

        - name: Record features scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['features'] }}"
          changed_when: false
          tags:
            - features

        - name: Validate Windows Firewall configuration
          ansible.builtin.import_tasks: tasks/validate-firewall.yml
          tags:
            - firewall

        - name: Record firewall scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['firewall'] }}"
          changed_when: false
          tags:
            - firewall

        - name: Validate System event log configuration
          ansible.builtin.import_tasks: tasks/validate-event-log.yml
          tags:
            - eventlog

        - name: Record event log scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['eventlog'] }}"
          changed_when: false
          tags:
            - eventlog

        - name: Validate recent System event health
          ansible.builtin.import_tasks: tasks/validate-event-health.yml
          tags:
            - eventhealth

        - name: Record event health scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['eventhealth'] }}"
          changed_when: false
          tags:
            - eventhealth

        - name: Validate patch and reboot health
          ansible.builtin.import_tasks: tasks/validate-patch-reboot-health.yml
          tags:
            - patchhealth

        - name: Record patch health scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['patchhealth'] }}"
          changed_when: false
          tags:
            - patchhealth

        - name: Validate scheduled task configuration
          ansible.builtin.import_tasks: tasks/validate-scheduled-task.yml
          tags:
            - scheduledtask

        - name: Record scheduled task scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['scheduledtask'] }}"
          changed_when: false
          tags:
            - scheduledtask

        - name: Validate account policy configuration
          ansible.builtin.import_tasks: tasks/validate-account-policy.yml
          tags:
            - accountpolicy

        - name: Record account policy scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['accountpolicy'] }}"
          changed_when: false
          tags:
            - accountpolicy

        - name: Validate Administrators group membership
          ansible.builtin.import_tasks: tasks/validate-admin-group-membership.yml
          tags:
            - admingroup

        - name: Record Administrators group scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['admingroup'] }}"
          changed_when: false
          tags:
            - admingroup

        - name: Validate built-in account states
          ansible.builtin.import_tasks: tasks/validate-account-state.yml
          tags:
            - accountstate

        - name: Record account state scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['accountstate'] }}"
          changed_when: false
          tags:
            - accountstate

        - name: Validate User Rights Assignment
          ansible.builtin.import_tasks: tasks/validate-user-rights.yml
          tags:
            - userrights

        - name: Record User Rights Assignment scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['userrights'] }}"
          changed_when: false
          tags:
            - userrights

        - name: Validate Advanced Audit Policy
          ansible.builtin.import_tasks: tasks/validate-audit-policy.yml
          tags:
            - auditpolicy

        - name: Record audit policy scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['auditpolicy'] }}"
          changed_when: false
          tags:
            - auditpolicy

        - name: Validate Windows Security Options
          ansible.builtin.import_tasks: tasks/validate-security-options.yml
          tags:
            - securityoptions

        - name: Record security options scope completion
          ansible.builtin.set_fact:
            qe_completed_scopes: "{{ qe_completed_scopes + ['securityoptions'] }}"
          changed_when: false
          tags:
            - securityoptions

      rescue:
        - name: Record SRV01 validation workflow failure
          ansible.builtin.set_fact:
            qe_suite_failed: true
            qe_failed_task: "{{ ansible_failed_task.name | default('Unknown task') }}"
            qe_failure_message: >-
              {{
                ansible_failed_result.msg
                | default('Validation workflow failed')
              }}
          changed_when: false
          tags:
            - always

      always:
        - name: Display SRV01 validation summary
          ansible.builtin.debug:
            msg:
              - "SRV01 QE Validation Summary"
              - "Requested scopes: {{ qe_requested_scopes }}"
              - "Completed scopes: {{ qe_completed_scopes }}"
              - "Expected identity: {{ server_identity }}"
              - "Expected Windows Time: {{ windows_time }}"
              - "Expected network configuration: {{ network_config }}"
              - "Expected Defender health: {{ defender_health }}"
              - "Expected recent event health: {{ event_log_health }}"
              - "Expected patch/reboot health: {{ patch_reboot_health }}"
              - "Expected scheduled task: {{ scheduled_task }}"
              - "Expected account policy: {{ account_policy }}"
              - "Expected Administrators group membership: {{ admin_group_membership }}"
              - "Expected account states: {{ account_state }}"
              - "Expected User Rights Assignment: {{ user_rights }}"
              - "Expected Advanced Audit Policy: {{ advanced_audit_policy }}"
              - "Expected Windows Security Options: {{ security_options }}"
              - "Required services: {{ required_services }}"
              - "Required features: {{ required_features }}"
              - "Expected DNS client: {{ dns_client_server }}"
              - "Expected Domain firewall enabled: {{ firewall_domain_enabled }}"
              - "Expected System log enabled: {{ system_event_log.enabled }}"
              - "Expected System log size: {{ system_event_log.maximum_size_bytes }}"
              - "Expected System log mode: {{ system_event_log.log_mode }}"
          tags:
            - always

        - name: Display collected QE results
          ansible.builtin.debug:
            var: qe_results
          tags:
            - always

        - name: Export SRV01 QE coverage evidence to JSON
          ansible.builtin.copy:
            content: >-
              {{
                {
                  'schema_version': 2,
                  'requested_scopes': qe_requested_scopes,
                  'completed_scopes': qe_completed_scopes,
                  'results': qe_results
                }
                | to_nice_json
              }}
            dest: "../reports/srv01-qe-results.json"
            mode: "0644"
          delegate_to: localhost
          run_once: true
          changed_when: false
          tags:
            - always

    - name: Fail SRV01 suite after preserving QE evidence
      ansible.builtin.fail:
        msg: >-
          SRV01 validation failed at '{{ qe_failed_task }}':
          {{ qe_failure_message }}
      when: qe_suite_failed | bool
      tags:
        - always
