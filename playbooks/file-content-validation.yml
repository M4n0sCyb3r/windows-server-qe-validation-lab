---
- name: Windows File Content Validation
  hosts: windows
  gather_facts: false

  tasks:
    - name: Collect hosts file content
      ansible.windows.win_powershell:
        script: |
          Get-Content "C:\Windows\System32\drivers\etc\hosts"
      register: hosts_content
      changed_when: false

    - name: Validate expected hosts file content
      ansible.builtin.assert:
        that:
          - "'# localhost name resolution is handled within DNS itself.' in (hosts_content.output | string)"
        success_msg: "PASS: hosts file contains expected localhost DNS comment"
        fail_msg: "FAIL: hosts file is missing expected localhost DNS comment"
