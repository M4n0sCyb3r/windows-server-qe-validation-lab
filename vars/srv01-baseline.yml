---
required_services:
  - WinRM

required_features:
  - Windows-Defender
  - PowerShell

dns_client_server: "10.10.10.10"

firewall_domain_enabled: true

system_event_log:
  enabled: true
  maximum_size_bytes: 20971520
  log_mode: "Circular"

server_identity:
  hostname: "SRV01"
  domain: "corp.lab"
  part_of_domain: true
  domain_role: 3

windows_time:
  service_name: "W32Time"
  service_state: "running"
  service_start_mode: "auto"
  expected_state_machine: 2
  expected_last_sync_error: 0

network_config:
  interface_alias: "Ethernet"
  ipv4_address: "10.10.10.20"
  prefix_length: 24
  address_state: "Preferred"
  dns_servers:
    - "10.10.10.10"

defender_health:
  am_service_enabled: true
  antivirus_enabled: true
  antispyware_enabled: true
  realtime_protection_enabled: true
  behavior_monitor_enabled: true
  ioav_protection_enabled: true
  disable_realtime_monitoring: false
  disable_behavior_monitoring: false
  disable_ioav_protection: false

event_log_health:
  log_name: "System"
  lookback_minutes: 60
  levels:
    - 1
    - 2
  max_allowed_events: 0

patch_reboot_health:
  expected_cbs_reboot_pending: false
  expected_wu_reboot_required: false
