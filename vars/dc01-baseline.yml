---
required_services:
  - DNS
  - NTDS
  - WinRM

dns_client_server: "127.0.0.1"

required_features:
  - AD-Domain-Services
  - DNS

smb_signing_required: 1

required_files:
  - 'C:\Windows\System32\drivers\etc\hosts'
required_file_content:
  hosts:
    path: 'C:\Windows\System32\drivers\etc\hosts'
    expected_text: '# localhost name resolution is handled within DNS itself.'

firewall_domain_enabled: true

system_event_log:
  enabled: true
  maximum_size_bytes: 20971520
  log_mode: "Circular"

winrm_basic_auth_enabled: false

server_identity:
  hostname: "DC01"
  domain: "corp.lab"
  part_of_domain: true
  domain_role: 5

windows_time:
  service_name: "W32Time"
  service_state: "running"
  service_start_mode: "auto"
  expected_state_machine: 2
  expected_last_sync_error: 0

network_config:
  interface_alias: "Ethernet"
  ipv4_address: "10.10.10.10"
  prefix_length: 24
  address_state: "Preferred"
  dns_servers:
    - "127.0.0.1"

event_log_health:
  log_name: "System"
  lookback_minutes: 60
  levels:
    - 1
    - 2
  max_allowed_events: 0

patch_reboot_health:
  expected_cbs_reboot_pending: false
  expected_wu_reboot_required: false

scheduled_task:
  task_name: "Server Initial Configuration Task"
  task_path: "\\Microsoft\\Windows\\"
  expected_state: "Disabled"
  expected_action_execute: "%windir%\\system32\\srvinitconfig.exe"
  expected_action_arguments: "/disableconfigtask"
  expected_trigger_enabled: true

account_policy:
  minimum_password_age: 1
  maximum_password_age: 42
  minimum_password_length: 7
  password_complexity: 1
  password_history_size: 24
  lockout_bad_count: 0

admin_group_membership:
  group_name: "Administrators"
  required_members:
    - "Domain Admins"
    - "Enterprise Admins"
    - "Administrator"

account_state:
  required_accounts:
    - name: "Administrator"
      enabled: true
    - name: "Guest"
      enabled: false
    - name: "krbtgt"
      enabled: false

user_rights:
  se_service_logon_right:
    - "S-1-5-80-0"
    - "S-1-5-99-0"
  se_remote_interactive_logon_right:
    - "S-1-5-32-544"
  se_deny_remote_interactive_logon_right: []
  se_deny_service_logon_right: []

advanced_audit_policy:
  logon: "Success and Failure"
  account_lockout: "Success"
  user_account_management: "Success"
  security_group_management: "Success"

security_options:
  lm_compatibility_level:
    expected_present: false

  restrict_anonymous:
    expected_present: true
    expected_value: 0

  restrict_anonymous_sam:
    expected_present: true
    expected_value: 1
